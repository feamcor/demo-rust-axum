[package]
name = "demo-rust-axum-examples-axum-restful-routes-and-resources-with-json"
version = "2.0.0"
edition = "2024"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
license = "GPL-2.0 OR GPL-3.0"
homepage = "https://github.com/joelparkerhenderson/demo-rust-axum"
repository = "https://github.com/joelparkerhenderson/demo-rust-axum"
documentation = "https://github.com/joelparkerhenderson/demo-rust-axum"

description = """
Demo of Rust and Axum / examples / axum-restful-routes-and-resources-with-json
"""

readme = "README.md"
keywords = ["demo", "rust", "axum", "web"]
categories = ["web-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "~0.8.8" }
tokio = { version = "~1.45.1", features = ["full"] }
serde = { version = "~1.0.228", features = ["derive"] }
serde_json = { version = "~1.0.149" }
base64 = { version = "~0.22.1" }
http = { version = "~1.3.1" }

[dev-dependencies]
axum-test = { version = "17.3.0" }
